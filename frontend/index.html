<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLEEMS - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="glass-panel login-card">
            <h2 class="text-gradient" style="text-align: center; margin-bottom: 2rem;">HLEEMS</h2>
            <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted);">Hostel Late Entry & Exit Management System</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Login</button>
                <div id="loginMessage" class="error-msg" style="text-align: center; margin-top: 1rem;"></div>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
